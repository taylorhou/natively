app = "teale-natively-hub"
primary_region = "sjc"

[build]
dockerfile = "Dockerfile"

[env]
PYTHONUNBUFFERED = "1"

[[mounts]]
source = "natively_hub_data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[project]
name = "natively"
version = "0.0.1"
description = "Natively v0 on citadel: protocol objects + a mail-wire adapter (SPEC.md v0.2, ad36d9a)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
